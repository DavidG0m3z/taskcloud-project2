<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskCloud - Gestor de Tareas</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>☁️ TaskCloud</h1>
        <p class="subtitle">Proyecto Cloud Computing - UDEA 2025</p>
        
        <div class="task-form">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Escribe tu nueva tarea..."
                onkeypress="if(event.key==='Enter') addTask()"
            >
            <button onclick="addTask()">➕ Agregar</button>
        </div>
        
        <div id="status"></div>
        
        <ul id="taskList" class="task-list">
            <li class="empty-state">Cargando tareas...</li>
        </ul>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
